name: Refresh game data
# Pulls latest nflverse data into /data (same-origin JSON.gz) so visitors
# never depend on third-party origins or CORS headers. Runs nightly during
# the season (nflverse refreshes after every game day) + on demand.
on:
  schedule:
    - cron: '20 13 * * *'   # daily 13:20 UTC ≈ post-update, pre-Sunday-night leftovers caught next pass
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch & project fresh data
        run: python scripts/refresh_data.py
      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "no data changes"; else
            git commit -m "data: nightly refresh $(date -u '+%F %R') UTC"
            git push
          fi
